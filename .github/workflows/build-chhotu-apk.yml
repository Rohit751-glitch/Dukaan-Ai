name: Build Chhotu_AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Copy APK to repository root
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Chhotu_AI.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chhotu_AI-APK
          path: Chhotu_AI.apk
          retention-days: 7
      - name: Commit APK for direct download
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Chhotu_AI.apk
          git diff --cached --quiet && exit 0
          git commit -m "Build installable Chhotu_AI APK [skip ci]"
          git push
